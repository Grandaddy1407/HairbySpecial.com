<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>User Dashboard</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      background-color: #f4f4f4;
    }
    .dashboard {
      background: white;
      padding: 30px;
      border-radius: 10px;
      max-width: 600px;
      margin: auto;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    h1 {
      color: #333;
    }
    a.logout {
      display: inline-block;
      margin-top: 20px;
      text-decoration: none;
      color: white;
      background: #ff4c4c;
      padding: 10px 20px;
      border-radius: 5px;
    }
  </style>
</head>
<body>

  <div class="dashboard">
    <h1>Welcome to Your Dashboard</h1>
    <p>You are now logged in.</p>

    <ul>
      <li>View Profile</li>
      <li>Manage Settings</li>
      <li>Check Notifications</li>
    </ul>

    <a href="index.html" class="logout">Logout</a>
  </div>

</body>
</html>
</body>
</html>
